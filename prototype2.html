
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stable Homotopy</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

<style>
body {
    font-family: Arial, Helvetica, sans-serif;
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
    line-height: 1.6;
}

h1, h2, h3 {
    color: #1f4e79;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.card {
    border: 1px solid #cccccc;
    border-radius: 10px;
    padding: 20px;
    margin-top: 20px;
}

.hidden {
    display: none;
}

.stem-list {
    list-style: none;
    padding-left: 0;
}

.stem-list > li {
    margin-bottom: 18px;
}

.element-sublist {
    margin-top: 8px;
    margin-left: 30px;
}

.element-sublist li {
    margin: 4px 0;
}

.back-link {
    display: inline-block;
    margin-bottom: 15px;
}

.section {
    margin-top: 20px;
}

.tag {
    display: inline-block;
    background: #eef4ff;
    color: #1f4e79;
    padding: 4px 8px;
    border-radius: 4px;
    margin-right: 4px;
}

a {
    color: #0066cc;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

    <h1>Stable Homotopy</h1>
    <ul id="stemList" class="stem-list"></ul>
</div>

<div id="elementView" class="hidden"></div>

;


function renderMath(container) {
    if (typeof renderMathInElement !== "function") {
        return;
    }

    renderMathInElement(container, {
        delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
        ],
        throwOnError: false
    });
}

function buildIndex() {
    const stemList = document.getElementById("stemList");
    stemList.innerHTML = "";

    const stems = {};

    elements.forEach(e => {
        if (!stems[e.stem]) {
            stems[e.stem] = [];
        }
        stems[e.stem].push(e);
    });

    Object.keys(stems)
        .map(Number)
        .sort((a, b) => a - b)
        .forEach(stem => {
            const li = document.createElement("li");

            const title = document.createElement("strong");
            title.textContent = `Stem ${stem}`;
            li.appendChild(title);

            const ul = document.createElement("ul");
            ul.className = "element-sublist";

            stems[stem].forEach(e => {
                const item = document.createElement("li");

                const link = document.createElement("a");
                link.href = `#${e.id}`;
                link.innerHTML = e.name;

                item.appendChild(link);
                ul.appendChild(item);
            });

            li.appendChild(ul);
            stemList.appendChild(li);
        });

    renderMath(stemList);
}


function goToRandomElement() {
    const randomIndex =
        Math.floor(Math.random() * elements.length);

    window.location.hash =
        elements[randomIndex].id;
}


function renderElement(id) {
    const index = elements.findIndex(x => x.id === id);
    const e = elements[index];

    if (!e) {
        showIndex();
        return;
    }

    const prev = index > 0 ? elements[index - 1] : null;
    const next = index < elements.length - 1 ? elements[index + 1] : null;


    document
        .getElementById("indexView")
        .classList.add("hidden");

    const notes =
        (e.notes || [])
        .map(x => `<li>${x}</li>`)
        .join("");

    const tags =
        (e.hashtags || [])
        .map(x => `<span class="tag">${x}</span>`)
        .join("");

    const view =
        document.getElementById("elementView");

    
    const navigation = `
        <div style="
            display:flex;
            justify-content:space-between;
            margin-top:15px;
            margin-bottom:15px;
        ">
            <div>
                ${prev
                    ? `<a href="#${prev.id}">&larr; Previous element</a>`
                    : ""}
            </div>
            <div>
                ${next
                    ? `<a href="#${next.id}">Next element &rarr;</a>`
                    : ""}
            </div>
        </div>
    `;

    view.innerHTML = `






        <div class="top-bar">
            <a href="#" class="back-link">
                ← Return to Index
            </a>

            <a
                href="javascript:void(0)"
                class="random-link"
                onclick="goToRandomElement()">
                Random element
            </a>

        </div>


        ${navigation}

        <div class="card">
            <h2>${e.name}</h2>

            <p>
                <strong>Stem:</strong>
                ${e.stem}
            </p>

            
            <p>
                <strong>Adams filtration:</strong>
                ${e.adamsFiltration}
            </p>

            ${e.adamsDetection ? `
            <p>
                <strong>Adams detection:</strong>
                ${e.adamsDetection}
            </p>
            ` : ""}

            <p>
                <strong>Adams-Novikov filtration:</strong>
                ${e.adamsNovikovFiltration}
            </p>

            ${e.adamsNovikovDetection ? `
            <p>
                <strong>Adams-Novikov detection:</strong>
                ${e.adamsNovikovDetection}
            </p>
            ` : ""}


            <div class="section">
                <h3>Notes</h3>
                <ul>
                    ${notes}
                </ul>
            </div>

            <div class="section">
                <h3>Tags</h3>
                ${tags}
            </div>
        </div>
    `;

    view.classList.remove("hidden");
    renderMath(view);
}

function showIndex() {
    document
        .getElementById("indexView")
        .classList.remove("hidden");

    document
        .getElementById("elementView")
        .classList.add("hidden");
}

function route() {
    const hash =
        window.location.hash.replace("#", "");

    if (hash === "") {
        showIndex();
    } else {
        renderElement(hash);
    }
}

window.addEventListener("hashchange", route);

window.addEventListener("load", () => {
    buildIndex();
    route();
    renderMath(document.body);
});
</script>

</body>
</html>
